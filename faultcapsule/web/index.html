<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fault Capsule</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#e6edf3; --dim:#8b949e;
          --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --purple:#bc8cff; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,'Segoe UI',sans-serif; padding:0 0 4rem; }
  header { display:flex; align-items:center; gap:1rem; flex-wrap:wrap; padding:.9rem 1.4rem;
           background:var(--panel); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:5; }
  h1 { font-size:1.05rem; letter-spacing:.02em; }
  h1 span { color:var(--accent); }
  .spacer { flex:1; }
  .chip { border:1px solid var(--border); border-radius:999px; padding:.2rem .7rem; font-size:.78rem; color:var(--dim); }
  .chip b { color:var(--text); font-weight:600; }
  .chip.on b { color:var(--warn); } .chip.off b { color:var(--ok); }
  .toggle { cursor:pointer; user-select:none; }
  .toggle.active { border-color:var(--accent); color:var(--accent); }
  main { max-width:1100px; margin:1.4rem auto; padding:0 1.4rem; display:grid; gap:1rem; }
  .panel { background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:1rem 1.2rem; }
  select,button { background:#21262d; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:.45rem .9rem; font-size:.9rem; }
  button.primary { background:#1f6feb; border-color:#1f6feb; cursor:pointer; font-weight:600; }
  button.primary:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:.8rem; align-items:center; flex-wrap:wrap; }
  .desc { color:var(--dim); margin-top:.5rem; font-size:.85rem; }
  .round { border-left:3px solid var(--accent); }
  .rtitle { display:flex; gap:.8rem; align-items:baseline; margin-bottom:.6rem; }
  .rtitle h2 { font-size:.95rem; }
  .vtag { font-size:.72rem; color:var(--purple); border:1px solid var(--purple); border-radius:4px; padding:0 .4rem; }
  .evid { display:grid; gap:.25rem; margin:.5rem 0; }
  .ev { font-size:.8rem; color:var(--dim); padding:.25rem .5rem; background:#0d1117; border-radius:5px; }
  .ev b { color:var(--accent); font-weight:600; }
  .ev.cited { outline:1px solid var(--ok); color:var(--text); }
  .ev.web { outline:1px dashed var(--warn); }
  .decision { margin-top:.7rem; padding:.7rem .9rem; border-radius:8px; background:#0d1117; }
  .decision .action { font-size:1rem; font-weight:700; color:var(--ok); }
  .decision .action.abstain { color:var(--warn); }
  .metrics { display:flex; gap:1.2rem; flex-wrap:wrap; margin-top:.6rem; font-size:.75rem; color:var(--dim); }
  .inspection { margin-top:.6rem; padding:.55rem .9rem; border-radius:8px; background:#132a13; font-size:.85rem; }
  .forbidden { color:var(--bad); font-size:.8rem; margin-top:.4rem; }
  .prov { font-size:.78rem; color:var(--warn); margin-top:.4rem; }
  .muted { color:var(--dim); font-size:.85rem; }
</style>
</head>
<body>
<header>
  <h1>⚙️ Fault <span>Capsule</span></h1>
  <span class="chip" id="adapter">model: …</span>
  <div class="spacer"></div>
  <span class="chip toggle off" id="netToggle">Network <b>OFF</b></span>
  <span class="chip toggle" id="plugToggle">SerpAPI add-on <b>unloaded</b></span>
  <span class="chip">outbound requests <b id="outbound">0</b></span>
</header>
<main>
  <div class="panel">
    <div class="row">
      <select id="incident"></select>
      <label class="muted"><input type="checkbox" id="webEvidence"> include external evidence (INC-006 demo)</label>
      <button class="primary" id="runBtn">Run diagnostic</button>
    </div>
    <div class="desc" id="incidentDesc"></div>
  </div>
  <div id="results"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let st = null;

async function api(path, body) {
  const res = await fetch('/api/' + path, body
    ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function refresh() {
  st = await api('state');
  $('adapter').innerHTML = `model: <b>${st.adapter.provider}/${st.adapter.model}</b>`;
  $('outbound').textContent = st.outbound_requests;
  const net = $('netToggle');
  net.className = 'chip toggle ' + (st.network_on ? 'on' : 'off');
  net.innerHTML = `Network <b>${st.network_on ? 'ON' : 'OFF'}</b>`;
  const pl = $('plugToggle');
  pl.classList.toggle('active', st.serpapi.loaded);
  pl.innerHTML = `SerpAPI add-on <b>${st.serpapi.loaded ? 'loaded' : (st.serpapi.key_configured ? 'unloaded' : 'no key')}</b>`;
  if (!$('incident').options.length)
    for (const i of st.incidents) $('incident').add(new Option(`${i.id} — ${i.title}`, i.id));
}

$('netToggle').onclick = async () => { await api('network', {on: !st.network_on}); await refresh(); };
$('plugToggle').onclick = async () => { await api('plugin', {enabled: !st.serpapi.enabled}); await refresh(); };

$('runBtn').onclick = async () => {
  $('runBtn').disabled = true;
  $('results').innerHTML = '<div class="panel muted">Running two-round diagnostic…</div>';
  try {
    const data = await api('run', {
      incident_id: $('incident').value,
      strategy: 'capsule',
      with_web_evidence: $('webEvidence').checked,
    });
    render(data);
  } catch (e) { $('results').innerHTML = `<div class="panel forbidden">${e.message}</div>`; }
  $('runBtn').disabled = false;
  await refresh();
};

function render(data) {
  $('incidentDesc').textContent = data.incident.description;
  let html = '';
  if (data.web_provenance)
    html += `<div class="panel"><div class="prov">🌐 External query: "${data.web_provenance.q}" — fields sent: [${data.web_provenance.fields_sent.join(', ')||'none'}] — reason: ${data.web_provenance.reason}</div></div>`;
  for (const r of data.rounds) {
    const cited = new Set(r.decision.cited_evidence_ids);
    const evid = r.capsule.evidence.map(e =>
      `<div class="ev ${cited.has(e.id)?'cited':''} ${e.kind==='web'?'web':''}"><b>${e.id}</b> [${e.kind}/${e.trust}] ${e.summary}</div>`).join('');
    const abstain = r.decision.status !== 'decision';
    html += `<div class="panel round">
      <div class="rtitle"><h2>Round ${r.round}</h2>
        <span class="vtag">Capsule v${r.capsule.version}${r.capsule.parent_version?` ← v${r.capsule.parent_version}`:''}</span>
        <span class="muted">~${r.capsule.approx_tokens} tokens, ${r.capsule.evidence.length} evidence${r.capsule.dropped_evidence_ids.length?`, ${r.capsule.dropped_evidence_ids.length} dropped`:''}</span></div>
      <div class="evid">${evid}</div>
      <div class="decision">
        <div class="action ${abstain?'abstain':''}">${abstain ? '⚠ insufficient_evidence (abstained)' : '→ ' + r.decision.action_id}</div>
        <div class="muted" style="margin-top:.3rem">${r.decision.rationale}</div>
        <div class="metrics">
          <span>cited: ${[...cited].join(', ')||'—'}</span>
          <span>confidence ${r.decision.confidence}</span>
          <span>${r.metrics.provider}/${r.metrics.model}</span>
          <span>${r.metrics.latency_ms} ms</span>
          <span>~${r.metrics.input_tokens} in / ${r.metrics.output_tokens} out tok</span>
          <span>${r.metrics.schema_ok ? 'schema ✓' : 'SCHEMA FAIL'} (${r.metrics.attempts} attempt${r.metrics.attempts>1?'s':''})</span>
        </div>
      </div>
      ${r.inspection ? `<div class="inspection">🔍 ${r.inspection.summary}</div>` : ''}
    </div>`;
  }
  html += `<div class="panel forbidden">⛔ Forbidden actions (never executable): ${data.forbidden_actions.map(a=>a.id).join(', ')}</div>`;
  $('results').innerHTML = html;
}

refresh();
</script>
</body>
</html>
